name: Registry snapshot integrity
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.32" "pandas>=2.2"
      - run: python -m compileall -q scripts/fetch_registry_snapshot.py scripts/analyze_hiddenness.py scripts/snapshot_integrity.py
      - run: python -m unittest discover -s tests -p 'test_snapshot_integrity.py' -v
      - name: Live registry and feature extraction
        run: python -m unittest discover -s tests -p 'test_live_api.py' -v
